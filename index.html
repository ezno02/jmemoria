<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula 12</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <div id="loader" class="hidden">
            <div class="portal-loader"></div>
            <p>Sincronizando dimensão...</p>
        </div>

        <div class="hidden" id="hud">
            <div id="hud-nome"></div>
            <div id="hud-timer"></div>
            <div id="hud-pares"></div>
        </div>

        <div id="resultado-api">
        </div>
    </div>

    <div id="tela-inicial">
        <div class="content">
            <div class="top">
                <img src="https://www.freeiconspng.com/thumbs/pokeball-png/pokeball-picture-6.png" alt="imagem que não tem na prova(pokebola)">
                <h2>POKÉMON</h2>
                <h3>Memory Game</h3>
            </div>
            <div class="bottom">
                <label for="name">Seu nome:</label>
                <input type="text" name="name" id="input-name">
                <button id="btn-name">Iniciar Jogo</button>
            </div>
        </div>
    </div>

    <div id="tela-final">
        <div class="content">
            <img src="" alt="imagem que não tem na prova(trofeu)">
            <h2>Você Venceu!</h2>
            <span id="pontuacao-ranking">pontos</span>
            <span id="tempo-ranking">tempo</span>
            <table id="tabela-ranking">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Jogador</th>
                        <th>Tempo</th>
                        <th>PTS</th>
                    </tr>
                </thead>
                <tbody id="tbody-ranking"></tbody>
            </table>
            <button id="play-agn-btn">Jogar Novamente</button>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
